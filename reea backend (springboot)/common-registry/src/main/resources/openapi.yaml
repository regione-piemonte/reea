    LoginRequestDTO:
      type: object
      description: Credenziali per il login interno
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    ExportFileListDTO:
      type: object
      description: DTO per la lista dei file di export dati massivi
      properties:
        file_id:
          type: integer
          format: int32
        elaborazione_id:
          type: integer
          format: int32
        nome:
          type: string
        tipo:
          type: string
          description: chiaro o pseudo
        stato:
          type: string
        data_richiesta:
          type: string
        data_generazione:
          type: string
        operatore:
          type: string

    AuditLogRequest:
      type: object
      properties:
        idApp:
          type: string
          description: Codice identificativo della componente applicativa (es. REEAFE, REEABE)
        ipAddress:
          type: string
          description: Indirizzo IP del client che effettua l'operazione
        utente:
          type: string
          description: Identificativo univoco dell'utente (tipicamente codice fiscale)
        operazione:
          type: string
          description: Nome dell'operazione effettuata (login, read, insert, update, delete oppure nome di business più specifico)
        oggOper:
          type: string
          nullable: true
          description: Descrizione/identificativo dell'oggetto trattato (es. nome tabella); non valorizzare per operazioni di login/logout
        keyOper:
          type: string
          nullable: true
          description: Chiave univoca del dato oggetto di operazione; non valorizzare per login/logout
        uuid:
          type: string
          nullable: true
          description: Identificativo della richiesta (es. X-Request-Id se presente in header); se assente può essere generato lato server
        requestPayload:
          type: string
          format: byte
          nullable: true
          description: Request payload serializzato (es. JSON UTF-8 in base64); NON va scritto per upload/download allegati
        responsePayload:
          type: string
          format: byte
          nullable: true
          description: Response payload serializzato (es. JSON UTF-8 in base64); NON va scritto per upload/download allegati
        esitoChiamata:
          type: integer
          format: int32
          description: HTTP status dell'operazione (es. 200, 500)
        loginLogout:
          type: boolean
          format: boolean
          nullable: false
          default: false
          description: Flag per indicare operazioni di login/logout; se true oggOper e keyOper non vanno valorizzati
        skipPayload:
          type: boolean
          format: boolean
          nullable: false
          default: false
          description: Se true non vengono tracciati requestPayload e responsePayload

    LoginResponseDTO:
      type: object
      description: Risposta al login interno (sessione già impostata server-side)
      properties:
        username:
          type: string
        ipAddress:
          type: string

    GetListaAnagraficheRequest:
      type: object
      additionalProperties: false
      properties:
        filtroFonteId:
          type: array
          items:
            type: integer
            format: int32
            nullable: true
            description: Lista di identificativi delle fonti di provenienza da filtrare
        descrizioniStato:
          type: array
          items:
            type: string
            nullable: true
            description: Lista delle descrizioni degli stati da filtrare
        sezione:
          type: array
          items:
            type: string
            nullable: true
            description: Lista delle sezioni dell'anagrafica da filtrare
        insInSorveglianza:
          type: boolean
          nullable: true
          description: Flag per filtrare le anagrafiche inserite in sorveglianza
        tipoElencoInail:
          type: string
          nullable: true
          description: Tipo elenco INAIL per il filtro
        assistenzaAslId:
          type: array
          items:
            type: integer
            format: int32
            nullable: true
            description: Lista di identificativi delle ASL di assistenza per il filtro
        codiceFiscale:
            type: string
            nullable: true
            description: Codice fiscale per il filtro server-side
        cognome:
            type: string
            nullable: true
            description: Cognome (parziale) per il filtro server-side
        nome:
            type: string
            nullable: true
            description: Nome (parziale) per il filtro server-side
        cognomeLettDa:
            type: string
            nullable: true
            description: Cognome (parziale) per il filtro lato DB (lettura diretta da tabella)
        cognomeLettA:
            type: string
            nullable: true
            description: Cognome (parziale) per il filtro lato DB (lettura diretta da tabella)
        nascitaData:
            type: string
            format: date
            nullable: true
            description: Data di nascita per il filtro server-side
        azzeraContatoreProssimoStep:
            type: boolean
            nullable: false
            description: Flag per capire se sto caricando gli step successivi della ricerca ( prossimi 1000 )
        profiloUtente:
            type: string
            nullable: false
        auditLogRequest:
          $ref: '#/components/schemas/AuditLogRequest'

    PdfListResponse:
      type: object
      description: DTO per la risposta della lista PDF
      properties:
        prefisso:
          type: integer
          format: int32
          description: Prefisso numerico utilizzato per la ricerca dei file PDF
          example: 200
        totaleTrovati:
          type: integer
          format: int32
          description: Numero totale di file PDF trovati
          example: 3
        pdfList:
          type: array
          description: Elenco dei file PDF trovati
          items:
            $ref: '#/components/schemas/PdfInfo'


    PdfInfo:
      type: object
      description: DTO che rappresenta le informazioni di un file PDF trovato nel filesystem
      properties:
        nomeFile:
          type: string
          description: Nome del file PDF
          example: 200_Scheda_S03_all2_Storia_prof_Industria_artigianatoV02-Nominativo-1.pdf
        percorsoAssoluto:
          type: string
          description: Percorso assoluto del file nel filesystem
        dimensione:
          type: integer
          format: int64
          description: Dimensione del file in byte
          example: 245678
        dataModifica:
          type: string
          format: date-time
          description: Data e ora dell'ultima modifica del file
          example: 2026-05-26T17:45:00

    ListaAnagraficheResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/AnagraficaDTO'
        totalRecords:
          type: integer
          format: int32
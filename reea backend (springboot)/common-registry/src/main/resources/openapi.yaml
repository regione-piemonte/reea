openapi: 3.0.3

info:
  title: API Anagrafica
  version: 1.0.0
  description: >
    API per la gestione CRUD della tabella Anagrafica e l'estrazione della lista anagrafiche del registro.
    Permette di creare, leggere, aggiornare ed eliminare le anagrafiche e ottenere in sola visualizzazione
    la lista delle anagraifiche del registro, ovvero:
    join tra reea_t_soggetto, 
              reea_t_registro,  
              reea_r_soggetto_fonte,
              reea_d_fonte,
              reea_d_soggetto_stato.
  contact:
    name: CSI Piemonte

servers:
  - url: /api
    description: url dell'api Anagrafica

paths:
  /batch/elaborazioneTracciati:
   get:
     summary: Avvia il batch di elaborazione tracciato dati
     operationId: triggerBatchTracciati
     tags:
      - Batch
     responses:
      '200':
        description: Batch avviato correttamente
        content:
          text/plain:
            schema:
              type: string	

  /batch/aggiornamentoAnagraficheDaAura:
   get:
     summary: Avvia il batch di estrazione anagrafiche
     operationId: triggerBatchAnagrafiche
     tags:
      - Batch
     responses:
      '200':
        description: Batch avviato correttamente
        content:
          text/plain:
            schema:
              type: string

  /anagrafiche:
    get:
      summary: Elenca tutte le anagrafiche in sola visualizzazione con dettaglio minimo.
      operationId: getListaAnagrafiche
      tags:
        - ListaAnagrafiche
      responses:
        '200':
          description: Lista anagrafiche recuperata correttamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnagraficaDTO'

    post:
      summary: Crea una nuova anagrafica
      operationId: createAnagrafica
      tags:
        - Anagrafica
      requestBody:
        description: Oggetto Anagrafica da creare
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnagraficaDTO'
      responses:
        '201':
          description: Anagrafica creata correttamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnagraficaDTO'

  /anagrafiche/{id}:
    get:
      summary: Recupera un'anagrafica per ID
      operationId: getAnagraficaById
      tags:
        - Anagrafica
      parameters:
        - name: id
          in: path
          description: ID s_soggetto_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Anagrafica trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnagraficaDTO'
        '404':
          description: Anagrafica non trovata

    put:
      summary: Aggiorna un'anagrafica esistente
      operationId: updateAnagrafica
      tags:
        - Anagrafica
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dati aggiornati dell'anagrafica
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnagraficaDTO'
      responses:
        '200':
          description: Anagrafica aggiornata correttamente
        '404':
          description: Anagrafica non trovata

    delete:
      summary: Elimina un'anagrafica
      operationId: deleteAnagrafica
      tags:
        - Anagrafica
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Anagrafica eliminata correttamente
        '404':
          description: Anagrafica non trovata

